[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envcause"
version = "0.1.0"
description = "Find the smallest environment configuration change set that reproduces a failure."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Deenesh Chowdhary"}]
keywords = ["debugging", "dotenv", "configuration", "delta-debugging", "cli", "devops", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/deeneshchowdhary/EnvCause"
Documentation = "https://github.com/deeneshchowdhary/EnvCause#readme"
Repository = "https://github.com/deeneshchowdhary/EnvCause"
Issues = "https://github.com/deeneshchowdhary/EnvCause/issues"
Changelog = "https://github.com/deeneshchowdhary/EnvCause/blob/master/CHANGELOG.md"

[project.scripts]
envcause = "envcause.cli:main"

[tool.setuptools.packages.find]
include = ["envcause*"]

name: EnvCause
description: Find the 1-minimal configuration change set that reproduces a failure
author: Deenesh Chowdhary

branding:
  icon: search
  color: orange

inputs:
  good:
    description: Path to the known-good configuration file
    required: true
  bad:
    description: Path to the known-bad configuration file
    required: true
  format:
    description: Configuration format (auto, dotenv, json, yaml, or toml)
    required: false
    default: auto
  config-output:
    description: Candidate path read by the command; required for JSON, YAML, and TOML
    required: false
  command:
    description: Reproduction command, parsed with shell-style quoting but executed without a shell
    required: true
  docker-image:
    description: Run each candidate in a fresh container from this Docker image
    required: false
  docker-run-args:
    description: Additional shell-quoted docker run arguments, such as --network=host or -v ./src:/app
    required: false
  kube-pod:
    description: Run each candidate in this existing Kubernetes pod
    required: false
  kube-namespace:
    description: Kubernetes namespace
    required: false
  kube-container:
    description: Container within the Kubernetes pod
    required: false
  kube-context:
    description: kubectl context
    required: false
  contains:
    description: Match a literal string in stdout or stderr
    required: false
  matches:
    description: Match a Python regular expression in stdout or stderr
    required: false
  junit:
    description: Path to a JUnit XML report generated by the reproduction command
    required: false
  repeat:
    description: Number of consecutive reproductions required
    required: false
    default: "1"
  verify-repeat:
    description: "Number of times to verify the known-good and known-bad baselines before reducing (default: repeat)"
    required: false
  parallel:
    description: "Test up to this many candidates concurrently during reduction; not supported for JSON/YAML/TOML configs, junit, or kube-pod (default: 1)"
    required: false
  timeout:
    description: Per-run timeout in seconds
    required: false
  cwd:
    description: Working directory for the reproduction command
    required: false
  max-tests:
    description: Maximum candidate subsets tested during reduction
    required: false
  cache-file:
    description: Path used for persistent candidate caching; empty disables persistent caching
    required: false
    default: .envcause-cache.json
  report-json:
    description: Path for the redacted machine-readable report
    required: false
    default: envcause-report.json
  write-repro:
    description: Optional path for a minimal .env reproduction file containing real values
    required: false
  progress:
    description: Show candidate progress in the action log
    required: false
    default: "true"
  step-summary:
    description: Add the reduced result to the GitHub Actions job summary
    required: false
    default: "true"
  show-values:
    description: Include values in logs, reports, and the job summary; use with care
    required: false
    default: "false"

outputs:
  report-path:
    description: Absolute path to the generated JSON report
    value: ${{ steps.envcause.outputs.report-path }}
  repro-path:
    description: Absolute path to the generated reproduction file, or empty when disabled
    value: ${{ steps.envcause.outputs.repro-path }}
  failure-inducing-count:
    description: Number of changes in the reduced failure-inducing set
    value: ${{ steps.envcause.outputs.failure-inducing-count }}
  command-executions:
    description: Number of reproduction command executions
    value: ${{ steps.envcause.outputs.command-executions }}
  cache-hits:
    description: Number of candidate results served from cache
    value: ${{ steps.envcause.outputs.cache-hits }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"
    - name: Install EnvCause
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Reduce configuration changes
      id: envcause
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        INPUT_GOOD: ${{ inputs.good }}
        INPUT_BAD: ${{ inputs.bad }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_CONFIG_OUTPUT: ${{ inputs.config-output }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DOCKER_IMAGE: ${{ inputs.docker-image }}
        INPUT_DOCKER_RUN_ARGS: ${{ inputs.docker-run-args }}
        INPUT_KUBE_POD: ${{ inputs.kube-pod }}
        INPUT_KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
        INPUT_KUBE_CONTAINER: ${{ inputs.kube-container }}
        INPUT_KUBE_CONTEXT: ${{ inputs.kube-context }}
        INPUT_CONTAINS: ${{ inputs.contains }}
        INPUT_MATCHES: ${{ inputs.matches }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_REPEAT: ${{ inputs.repeat }}
        INPUT_VERIFY_REPEAT: ${{ inputs.verify-repeat }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_CWD: ${{ inputs.cwd }}
        INPUT_MAX_TESTS: ${{ inputs.max-tests }}
        INPUT_CACHE_FILE: ${{ inputs.cache-file }}
        INPUT_REPORT_JSON: ${{ inputs.report-json }}
        INPUT_WRITE_REPRO: ${{ inputs.write-repro }}
        INPUT_PROGRESS: ${{ inputs.progress }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
        INPUT_SHOW_VALUES: ${{ inputs.show-values }}
      run: python -m envcause.github_action

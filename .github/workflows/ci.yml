name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check build twine pip-audit
          python -m build
          python -m twine check dist/*
          python -m pip_audit .

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise the local EnvCause action
        id: envcause
        uses: ./
        with:
          good: examples/good.env
          bad: examples/bad.env
          command: python examples/demo_app.py
          progress: "false"
      - name: Verify action outputs
        env:
          FAILURE_INDUCING_COUNT: ${{ steps.envcause.outputs.failure-inducing-count }}
        run: test "$FAILURE_INDUCING_COUNT" = "2"

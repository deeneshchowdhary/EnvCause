name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the local EnvCause action
        id: envcause
        uses: ./
        with:
          good: examples/good.env
          bad: examples/bad.env
          command: python examples/demo_app.py
          progress: "false"
      - name: Verify action outputs
        env:
          FAILURE_INDUCING_COUNT: ${{ steps.envcause.outputs.failure-inducing-count }}
        run: test "$FAILURE_INDUCING_COUNT" = "2"

name: Bug report
description: Report incorrect or unexpected EnvCause behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste credentials or production environment values into an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a sanitized command and sanitized good/bad configuration when possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EnvCause version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12 on Ubuntu 24.04
    validations:
      required: true
